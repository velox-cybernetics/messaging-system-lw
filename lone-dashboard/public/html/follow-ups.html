<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#000000">
        <title>Follow ups | Lone Wraps</title>
        <link rel="stylesheet" href="/css/base.css">
        <link rel="stylesheet" href="/css/follow-ups.css">
        <script type="module" src="/js/follow-ups.js"></script>
    </head>
    <body>
        <!--TOP BAR-->
        <header class="bar">
            <a class="brand" href="/"><img src="/img/logo.png" alt="Lone Wraps &amp; Graphics" width="401" height="96"></a>
            <nav class="nav" aria-label="Pages">
                <a href="/"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-6M12 20V5M19 20v-9M3 20h18" /></svg>Overview</a>
                <a href="/messages"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5h15v11h-9l-6 4z" /></svg>Messages</a>
                <a href="/follow-ups" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" /></svg>Follow ups</a>
                <a href="/system"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2" /><circle cx="9" cy="17" r="2" /></svg>System info</a>
            </nav>
            <button type="button" class="sign-out">Sign out</button>
        </header>


        <!--MAIN-->
        <main class="follow-ups">
            <h1 class="wide">Follow ups</h1>

            <!--TRACK-->
            <div class="track" id="track"></div>

            <!--PAGER-->
            <nav class="pager" id="pager" aria-label="Follow up pages" hidden>
                <button type="button" class="button quiet" id="previous" aria-label="Previous page">&larr;</button>
                <span class="page" id="page"></span>
                <button type="button" class="button quiet" id="next" aria-label="Next page">&rarr;</button>
            </nav>
        </main>
    </body>
</html>
