<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#000000">
        <title>Messages | Lone Wraps</title>
        <link rel="stylesheet" href="/css/base.css">
        <link rel="stylesheet" href="/css/messages.css">
        <script type="module" src="/js/messages.js"></script>
    </head>
    <body>
        <!--TOP BAR-->
        <header class="bar">
            <a class="brand" href="/"><img src="/img/logo.png" alt="Lone Wraps &amp; Graphics" width="401" height="96"></a>
            <nav class="nav" aria-label="Pages">
                <a href="/"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-6M12 20V5M19 20v-9M3 20h18" /></svg>Overview</a>
                <a href="/messages" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5h15v11h-9l-6 4z" /></svg>Messages</a>
                <a href="/follow-ups"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" /></svg>Follow ups</a>
                <a href="/system"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2" /><circle cx="9" cy="17" r="2" /></svg>System info</a>
            </nav>
            <button type="button" class="sign-out">Sign out</button>
        </header>


        <!--MAIN-->
        <main class="messages" id="messages">
            <!--TABS-->
            <nav class="tabs" id="tabs" aria-label="Channels"></nav>

            <div class="split">
                <!--LIST-->
                <section class="list" id="list-pane" aria-label="Conversations">
                    <div class="channel-bar" id="channel-bar" hidden>
                        <p class="channel-note">Whole channel</p>
                        <button type="button" class="switch" id="channel-switch" role="switch" aria-checked="true">
                            <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
                            <span id="channel-switch-label">System on</span>
                        </button>
                    </div>
                    <div class="list-head" id="list-head" hidden>
                        <!--SEARCH-->
                        <form class="search" id="search" role="search">
                            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                                <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8" />
                                <path d="m15.5 15.5 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                            </svg>
                            <input type="search" id="search-text" placeholder="Search names, cars, services" aria-label="Search this channel's conversations" maxlength="100" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
                            <button type="button" class="search-clear" id="search-clear" aria-label="Clear search" hidden>
                                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                                    <path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                                </svg>
                            </button>
                        </form>
                        <div class="segments views" role="group" aria-label="Conversation lists">
                            <button type="button" class="segment" id="view-on" aria-pressed="true">System on<span class="view-count" id="view-on-count"></span></button>
                            <button type="button" class="segment" id="view-booked" aria-pressed="false">Booked HILs<span class="view-count" id="view-booked-count"></span></button>
                            <button type="button" class="segment" id="view-off" aria-pressed="false">System off<span class="view-count" id="view-off-count"></span></button>
                        </div>
                    </div>
                    <p class="list-note" id="list-note">Loading conversations…</p>
                    <ul class="convos" id="convos"></ul>
                    <button type="button" class="button quiet more" id="more" hidden>Show older conversations</button>
                </section>

                <!--THREAD-->
                <section class="thread" aria-label="Conversation">
                    <header class="thread-head" id="thread-head" hidden>
                        <button type="button" class="back" id="back" aria-label="All conversations">
                            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                                <path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                        <div class="thread-who">
                            <h2 class="thread-name" id="thread-name"></h2>
                            <p class="thread-meta" id="thread-meta"></p>
                        </div>
                        <div class="thread-controls">
                            <button type="button" class="switch" id="switch" role="switch" aria-checked="true" aria-label="System replies to this customer">
                                <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
                                <span id="switch-label">System on</span>
                            </button>
                            <button type="button" class="icon-button upvote-button" id="upvote" aria-label="Up-weight the last response" title="Up-weight the last response" data-stage="idle">
                                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                                    <path d="M12 19.5V5m0 0-6 6m6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                                <svg class="upvote-ring" viewBox="0 0 52 52" aria-hidden="true">
                                    <circle cx="26" cy="26" r="24" />
                                </svg>
                            </button>
                            <button type="button" class="icon-button flag-button" id="flag" aria-label="Flag this conversation" title="Flag this conversation">
                                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                                    <path d="M5.5 21V4.5m0 0h11.5l-2.4 4.25L17 13H5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                            <button type="button" class="icon-button trash-button" id="trash" aria-label="Delete this conversation" title="Delete this conversation">
                                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                                    <path d="M4.5 7h15M9.5 7V4.5h5V7m-8 0 1 12.5h9l1-12.5M10 11v5m4-5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                        </div>
                    </header>
                    <div class="log" id="log"></div>
                    <form class="compose" id="compose" hidden>
                        <textarea id="compose-text" rows="1" maxlength="2000" placeholder="Text them from the Blooio line" aria-label="Text to send"></textarea>
                        <button type="submit" class="button" id="compose-send">Send</button>
                    </form>
                </section>
            </div>
        </main>


        <!--FLAG DIALOG-->
        <dialog class="dialog" id="flag-dialog" aria-labelledby="flag-title">
            <form id="flag-form">
                <h2 id="flag-title">Flag this conversation</h2>
                <p class="dialog-note">Emails the system's last reply, the state it was written from, and what you write here.</p>
                <label for="flag-text">What went wrong?</label>
                <textarea id="flag-text" rows="6" maxlength="4000"></textarea>
                <p class="error" id="flag-error" role="alert" hidden></p>
                <div class="dialog-actions">
                    <button type="button" class="button quiet" id="flag-cancel">Cancel</button>
                    <button type="submit" class="button" id="flag-send">Send flag</button>
                </div>
            </form>
        </dialog>


        <!--UPVOTE DIALOG-->
        <dialog class="dialog" id="upvote-dialog" aria-label="Up-weight the last response">
            <form id="upvote-form">
                <textarea id="upvote-text" rows="3" maxlength="2000" placeholder="Reason for up-weighting?" aria-label="Reason for up-weighting"></textarea>
                <p class="error" id="upvote-error" role="alert" hidden></p>
                <div class="dialog-actions">
                    <button type="button" class="button quiet" id="upvote-cancel">Cancel</button>
                    <button type="submit" class="button" id="upvote-send">Up-weight</button>
                </div>
            </form>
        </dialog>


        <!--TRASH DIALOG-->
        <dialog class="dialog" id="trash-dialog" aria-labelledby="trash-title">
            <form id="trash-form">
                <h2 id="trash-title">Delete this conversation?</h2>
                <p class="dialog-note" id="trash-note"></p>
                <p class="error" id="trash-error" role="alert" hidden></p>
                <div class="dialog-actions">
                    <button type="button" class="button quiet" id="trash-cancel" autofocus>Cancel</button>
                    <button type="submit" class="button danger" id="trash-confirm">Delete</button>
                </div>
            </form>
        </dialog>
    </body>
</html>
