<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#000000">
        <title>Sign in | Lone Wraps</title>
        <link rel="stylesheet" href="/css/base.css">
        <link rel="stylesheet" href="/css/login.css">
        <script type="module" src="/js/login.js"></script>
    </head>
    <body>
        <!--LOGIN-->
        <main class="login">
            <form class="login-form" id="login-form">
                <h1 class="login-logo"><img src="/img/logo.png" alt="Lone Wraps &amp; Graphics" width="401" height="96"></h1>
                <p class="login-note">Messaging dashboard</p>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <p class="error" id="login-error" role="alert" hidden></p>
                <button type="submit" class="button" id="login-button">Sign in</button>
            </form>
        </main>
    </body>
</html>
